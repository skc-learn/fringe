name: publish
# Push a tag like v0.1.2 to publish. Uses npm trusted publishing (OIDC): no token or 2FA code is stored anywhere.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24          # ships npm >= 11.5, required for trusted publishing
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag must match the package version
        run: |
          v=$(node -p "require('./packages/cli/package.json').version")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package.json v$v"; exit 1; }
      - run: pnpm test            # drift test also checks plugin.json and --version
      # GitHub first: the release (with the packed tarball attached) exists even if npm is down or slow, so there is always a download.
      - name: GitHub Release with the tarball
        working-directory: packages/cli
        run: |
          pnpm build                 # npm pack alone does not build: without this the tarball has no dist/
          npm pack --silent
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || for i in 1 2 3; do gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}" && break; sleep 15; done
          gh release upload "${GITHUB_REF_NAME}" ./*.tgz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to npm
        working-directory: packages/cli
        timeout-minutes: 10      # npm's registry can hang; fail loudly instead of holding the run for hours
        run: npm publish --provenance --access public
